<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            display: grid;
            place-items: center;
            min-height: 100vh;
        }
        #D1{
            width: 400px;
            height: 80vh;
            background-color: aqua;
            position: relative;
        }
        #d1{
            width: 100px;
            height: 20vh;
            background-color: black;
            position: absolute;
            border: 4px solid red;
        }
        #d2{
            width: 100px;
            height: 20vh;
            background-color: black;
            position: absolute;
            border: 4px solid red;
            right: 0px;
        }
        #d3{
            width: 100px;
            height: 20vh;
            background-color: black;
            position: absolute;
            border: 4px solid red;
            bottom: 0px;

        }
        #d4{
            width: 100px;
            height: 20vh;
            background-color: black;
            position: absolute;
            border: 4px solid red;
            bottom: 0px;
            right: 0px;
        }
    </style>
</head>
<body>
    <div id="D1">
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
    </div>
</body>
</html>
